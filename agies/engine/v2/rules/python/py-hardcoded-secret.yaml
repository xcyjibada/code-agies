# agies SAST rule: Hardcoded secret / API key / password
# CWE-798: Use of Hard-coded Credentials
id: py-hardcoded-secret
name: Hardcoded secret or credential
language: python
severity: high
cwe: [798]
message: >-
  Hardcoded credentials, API keys, or passwords in source code.
  Use environment variables or a secrets manager instead.
query: |
  (assignment
    left: (identifier) @match
    right: [
      (string) @value
      (concatenated_string) @concat_value
    ]
  )
capture_group: match
match_any:
  - "password"
  - "PASSWORD"
  - "api_key"
  - "API_KEY"
  - "secret"
  - "SECRET"
  - "auth_token"
  - "AUTH_TOKEN"
