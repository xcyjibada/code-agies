[project]
name = "agies"
version = "0.1.0"
description = "AI-native code audit CLI"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "openai>=1.0.0",
    "anthropic>=0.30.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "tree-sitter>=0.22.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
java = [
    "tree-sitter>=0.22.0",
    "tree-sitter-java>=0.22.0",
]
js = [
    "tree-sitter>=0.22.0",
    "tree-sitter-javascript>=0.22.0",
    "tree-sitter-typescript>=0.22.0",
]

[project.scripts]
agies = "agies.cli:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agies*"]
